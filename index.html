<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Synora — One calm home for everything you're studying</title>
  <meta name="description"
    content="Synora brings your tasks, assignments, notes, timetable, and grades into a single, quiet workspace. Create a free account and start with a clear week.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181C" media="(prefers-color-scheme: dark)">

  <!-- Link previews (WhatsApp, LinkedIn, Slack, X, …): public/og-image.png -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Synora">
  <meta property="og:url" content="https://synora-v1.vercel.app/">
  <meta property="og:title" content="Synora — One calm home for everything you're studying">
  <meta property="og:description" content="Tasks, timetable, notes, CGPA and attendance in one quiet workspace. Free, with light and dark themes, and your work saved to every device.">
  <meta property="og:image" content="https://synora-v1.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Synora: the dashboard in light and dark, next to the tagline 'One calm home for everything you're studying.'">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Synora — One calm home for everything you're studying">
  <meta name="twitter:description" content="Tasks, timetable, notes, CGPA and attendance in one quiet workspace.">
  <meta name="twitter:image" content="https://synora-v1.vercel.app/og-image.png">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <!-- Installable app: public/manifest.webmanifest + public/sw.js -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Synora">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap">

  <!-- Apply the saved theme before the first paint (public/theme-init.js). -->
  <script src="/theme-init.js"></script>

  <!-- Vercel Web Analytics -->
  <script src="/analytics-init.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
