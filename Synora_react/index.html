<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synora — One calm home for everything you're studying</title>
  <meta name="description"
    content="Synora brings your tasks, assignments, notes, timetable, and grades into a single, quiet workspace. Create a free account and start with a clear week.">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/favicon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap">

  <!-- Apply the saved theme before the first paint, so a dark-mode user
       never sees a white flash while the app loads (see src/lib/theme.js). -->
  <script>
    (function () {
      var saved = localStorage.getItem("synora-theme");
      var systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (systemPrefersDark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
