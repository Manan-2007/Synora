# Push reminders: every 10 minutes, ask the live API to send any class
# reminders that are due (server/push.js). GitHub may start scheduled runs
# a few minutes late, which is why the API looks 20 minutes ahead.
# Needs the repository secret CRON_SECRET (the same value as in Vercel).
name: Push reminders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://synora-v1.vercel.app/api/push/tick
